<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #222; color: white; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); grid-gap: 5px; justify-content: center; margin-top: 50px; }
        .cell { width: 100px; height: 100px; background-color: #333; font-size: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid #555; }
        .cell:hover { background-color: #444; }
        #status { margin-top: 20px; font-size: 20px; }
        button { margin-top: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #e44d26; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Tic Tac Toe Game ⭕ ❌</h1>
    <div id="status">Player X's turn</div>
    
    <div class="board" id="board">
        <div class="cell" onclick="makeMove(this, 0)"></div>
        <div class="cell" onclick="makeMove(this, 1)"></div>
        <div class="cell" onclick="makeMove(this, 2)"></div>
        <div class="cell" onclick="makeMove(this, 3)"></div>
        <div class="cell" onclick="makeMove(this, 4)"></div>
        <div class="cell" onclick="makeMove(this, 5)"></div>
        <div class="cell" onclick="makeMove(this, 6)"></div>
        <div class="cell" onclick="makeMove(this, 7)"></div>
        <div class="cell" onclick="makeMove(this, 8)"></div>
    </div>

    <button onclick="resetGame()">Restart Game</button>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let gameActive = true;

        const winConditions = [, [3, 4, 5], [6, 7, 8],
, [1, 4, 7], [2, 5, 8],
, [2, 4, 6]
        ];

        function makeMove(cell, index) {
            if (board[index] !== "" || !gameActive) return;
            board[index] = currentPlayer;
            cell.innerText = currentPlayer;
            
            checkResult();
        }

        function checkResult() {
            let roundWon = false;
            for (let i = 0; i < winConditions.length; i++) {
                const [a, b, c] = winConditions[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                document.getElementById("status").innerText = `Player ${currentPlayer} Wins! 🎉`;
                gameActive = false;
                return;
            }

            if (!board.includes("")) {
                document.getElementById("status").innerText = "Game is a Draw! 🤝";
                gameActive = false;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            document.getElementById("status").innerText = `Player ${currentPlayer}'s turn`;
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            gameActive = true;
            document.getElementById("status").innerText = "Player X's turn";
            document.querySelectorAll('.cell').forEach(cell => cell.innerText = "");
        }
    </script>
</body>
</html>
