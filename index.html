<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #222;
            color: white;
        }

        h1 {
            margin-top: 30px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 5px;
            justify-content: center;
            margin-top: 40px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background: #333;
            border: 2px solid #555;
            font-size: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .cell:hover {
            background: #444;
        }

        #status {
            margin-top: 20px;
            font-size: 22px;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            font-size: 17px;
            cursor: pointer;
            background: #e44d26;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>Tic Tac Toe Game ⭕ ❌</h1>

    <div id="status">Player X's turn</div>

    <div class="board">

        <div class="cell" onclick="makeMove(this, 0)"></div>
        <div class="cell" onclick="makeMove(this, 1)"></div>
        <div class="cell" onclick="makeMove(this, 2)"></div>

        <div class="cell" onclick="makeMove(this, 3)"></div>
        <div class="cell" onclick="makeMove(this, 4)"></div>
        <div class="cell" onclick="makeMove(this, 5)"></div>

        <div class="cell" onclick="makeMove(this, 6)"></div>
        <div class="cell" onclick="makeMove(this, 7)"></div>
        <div class="cell" onclick="makeMove(this, 8)"></div>

    </div>

    <button onclick="resetGame()">Restart Game</button>

    <script>

        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let gameActive = true;

        const winConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function makeMove(cell, index) {

            if (board[index] !== "" || !gameActive) {
                return;
            }

            board[index] = currentPlayer;
            cell.innerText = currentPlayer;

            checkResult();
        }

        function checkResult() {

            for (let condition of winConditions) {

                const a = condition[0];
                const b = condition[1];
                const c = condition[2];

                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[b] === board[c]
                ) {

                    document.getElementById("status").innerText =
                        "Player " + currentPlayer + " Wins! 🎉";

                    gameActive = false;
                    return;
                }
            }

            // Draw check
            if (!board.slice(0, 9).includes("")) {

                document.getElementById("status").innerText =
                    "Game is a Draw! 🤝";

                gameActive = false;
                return;
            }

            // Change player
            currentPlayer = currentPlayer === "X" ? "O" : "X";

            document.getElementById("status").innerText =
                "Player " + currentPlayer + "'s turn";
        }

        function resetGame() {

            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            gameActive = true;

            document.getElementById("status").innerText =
                "Player X's turn";

            document.querySelectorAll(".cell").forEach(function(cell) {
                cell.innerText = "";
            });
        }

    </script>

</body>
</html>
